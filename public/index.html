<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudinary AI Media Pipeline</title>
  <style>
    :root { --ink:#ecf3ff; --muted:#9fafc8; --line:rgba(255,255,255,.11); --panel:rgba(16,25,50,.66); --accent:#8b7cff; --cyan:#54d8ff; --good:#65e3a2; --warn:#ffd66b; --bad:#ff8495; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; overflow-x:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:#080d1c; }
    body::before,body::after { content:""; position:fixed; width:42rem; height:42rem; border-radius:50%; filter:blur(42px); opacity:.25; z-index:-1; animation:drift 16s ease-in-out infinite alternate; }
    body::before { background:#543acb; top:-17rem; left:-12rem; } body::after { background:#077ca8; right:-17rem; bottom:-14rem; animation-delay:-8s; }
    .shell { max-width:1120px; margin:0 auto; padding:42px 24px 68px; }.eyebrow { display:flex; align-items:center; gap:8px; margin:0 0 14px; color:#bac7ff; letter-spacing:.14em; font-size:.72rem; font-weight:800; text-transform:uppercase; animation:rise .6s both; }.pulse { width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 rgba(101,227,162,.7); animation:pulse 2s infinite; }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:32px; }h1 { max-width:680px; margin:0; font-size:clamp(2.35rem,6vw,4.6rem); line-height:.98; letter-spacing:-.06em; animation:rise .7s .08s both; }h1 span { color:transparent; background:linear-gradient(100deg,var(--cyan),#b597ff 55%,#ffb4dd); background-clip:text; }.intro { max-width:270px; margin:0 0 5px; color:var(--muted); font-size:.92rem; line-height:1.55; animation:rise .7s .16s both; }
    .workspace { display:grid; grid-template-columns:1fr 1fr; gap:16px; }.panel { position:relative; overflow:hidden; padding:22px; border:1px solid var(--line); border-radius:22px; background:var(--panel); box-shadow:0 18px 60px rgba(0,0,0,.18); backdrop-filter:blur(16px); animation:rise .75s .22s both; }.panel:nth-child(2) { animation-delay:.31s; }.panel::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(125deg,rgba(255,255,255,.08),transparent 30%); }h2 { position:relative; z-index:1; display:flex; align-items:center; gap:10px; margin:0 0 18px; font-size:.95rem; letter-spacing:.01em; }.step { display:grid; place-items:center; width:23px; height:23px; border-radius:7px; color:#d6d1ff; background:rgba(139,124,255,.2); font-size:.72rem; }
    .fields { position:relative; z-index:1; display:grid; grid-template-columns:1.2fr .8fr auto; gap:9px; }input,button { min-width:0; border:0; border-radius:11px; font:inherit; transition:transform .2s ease,box-shadow .2s ease,outline-color .2s ease; }input { width:100%; padding:11px 12px; outline:1px solid var(--line); color:var(--ink); background:rgba(5,11,29,.64); font-size:.85rem; }input::file-selector-button { margin-right:9px; border:0; border-radius:6px; padding:4px 7px; color:#d9e6ff; background:#273456; font:inherit; cursor:pointer; }input:focus { outline:1px solid rgba(84,216,255,.78); box-shadow:0 0 0 4px rgba(84,216,255,.1); }button { padding:11px 16px; color:#fff; background:linear-gradient(135deg,#7568ef,#4fbbeb); font-size:.84rem; font-weight:750; cursor:pointer; box-shadow:0 7px 20px rgba(81,93,225,.22); }button:hover { transform:translateY(-2px); box-shadow:0 11px 26px rgba(81,93,225,.36); }button:active { transform:translateY(0) scale(.98); }button.secondary { color:#cad5e9; background:rgba(255,255,255,.07); box-shadow:none; outline:1px solid var(--line); }.status { position:relative; z-index:1; min-height:20px; margin:13px 0 0; color:var(--muted); font-size:.78rem; }.status.loading { color:#bcb6ff; animation:softPulse 1.2s ease infinite; }.search-fields { grid-template-columns:1fr 1fr auto auto; }
    .gallery-head { display:flex; justify-content:space-between; align-items:center; margin:35px 2px 14px; animation:rise .75s .4s both; }.gallery-head h2 { margin:0; font-size:1.1rem; }#resultCount { color:var(--muted); font-size:.78rem; }#gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(208px,1fr)); gap:14px; }.card { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:rgba(15,23,47,.72); box-shadow:0 12px 30px rgba(0,0,0,.14); animation:cardIn .5s both; transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease; }.card:hover { transform:translateY(-6px); border-color:rgba(133,202,255,.48); box-shadow:0 22px 38px rgba(0,0,0,.26); }.card img { width:100%; height:156px; object-fit:cover; display:block; background:linear-gradient(105deg,#17223e,#26365d,#17223e); background-size:200% 100%; animation:shimmer 1.7s infinite; transition:transform .5s ease; }.card:hover img { transform:scale(1.06); }.meta { padding:12px; font-size:.75rem; color:var(--muted); }.media-name { overflow:hidden; color:#e8effc; font-size:.8rem; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }.tags { min-height:18px; margin:5px 0 9px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.badge { display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border-radius:99px; font-size:.67rem; font-weight:800; text-transform:capitalize; }.badge::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }.approved { color:#8bf2b9; background:rgba(71,199,130,.13); }.pending { color:var(--warn); background:rgba(255,214,107,.12); }.rejected { color:#ff9eab; background:rgba(255,132,149,.12); }.empty { grid-column:1/-1; padding:50px 20px; border:1px dashed var(--line); border-radius:18px; color:var(--muted); text-align:center; animation:rise .35s both; }
    @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }@keyframes cardIn { from { opacity:0; transform:translateY(14px) scale(.97); } to { opacity:1; transform:none; } }@keyframes drift { to { transform:translate(9rem,5rem) scale(1.17); } }@keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(101,227,162,0); } 100% { box-shadow:0 0 0 0 rgba(101,227,162,0); } }@keyframes softPulse { 50% { opacity:.5; } }@keyframes shimmer { to { background-position:-200% 0; } }@media (max-width:720px) { .shell { padding:30px 17px 50px; }header,.workspace { display:block; }.intro { margin-top:17px; }.panel + .panel { margin-top:14px; }.fields,.search-fields { grid-template-columns:1fr; }.gallery-head { margin-top:27px; } }@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body><main class="shell"><p class="eyebrow"><i class="pulse"></i> Intelligent asset workspace</p><header><h1>Your media, <span>in motion.</span></h1><p class="intro">Upload, analyse and find every asset in one calm, AI-powered pipeline.</p></header><div class="workspace"><section class="panel"><h2><span class="step">01</span> Add media</h2><div class="fields"><input type="file" id="fileInput" /><input type="text" id="userId" placeholder="User ID (optional)" /><button onclick="uploadFile()">Upload</button></div><p class="status" id="uploadStatus" aria-live="polite">Ready when you are.</p></section><section class="panel"><h2><span class="step">02</span> Find an asset</h2><div class="fields search-fields"><input type="text" id="tagQuery" placeholder="Tag, e.g. dog" /><input type="text" id="categoryQuery" placeholder="Category" /><button onclick="runSearch()">Search</button><button class="secondary" onclick="loadAll()">All</button></div><p class="status">Search by AI tags or category.</p></section></div><div class="gallery-head"><h2>Media library</h2><span id="resultCount">Loading assets…</span></div><div id="gallery" aria-live="polite"></div></main>
  <script>
    const gallery=document.getElementById('gallery'),count=document.getElementById('resultCount');const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function uploadFile(){const file=document.getElementById('fileInput').files[0],userId=document.getElementById('userId').value||'demo-user',status=document.getElementById('uploadStatus');if(!file){status.textContent='Choose a file first.';return}try{const form=new FormData();form.append('file',file);form.append('userId',userId);status.textContent='Uploading and analysing…';status.classList.add('loading');const res=await fetch('/api/upload',{method:'POST',body:form}),data=await res.json();if(!res.ok)throw new Error(data.error||'Upload failed');status.textContent=`Uploaded: ${data.media.publicId} · ${data.media.moderationStatus}`;loadAll()}catch(error){status.textContent=`Upload error: ${error.message}`}finally{status.classList.remove('loading')}}
    async function runSearch(){const params=new URLSearchParams({approvedOnly:'false'}),tag=document.getElementById('tagQuery').value.trim(),category=document.getElementById('categoryQuery').value.trim();if(tag)params.set('tag',tag);if(category)params.set('category',category);count.textContent='Searching…';try{const res=await fetch('/api/search?'+params),data=await res.json();if(!res.ok)throw new Error(data.error||'Search failed');renderGallery((data.resources||[]).map(r=>({publicId:r.public_id,thumb:r.delivery?.thumbnail,tags:r.tags,status:r.context?.custom?.moderation_status||'pending'})))}catch(error){renderGallery([]);count.textContent=`Could not search: ${error.message}`}}
    async function loadAll(){count.textContent='Loading assets…';try{const res=await fetch('/api/media'),data=await res.json();if(!res.ok)throw new Error(data.error||'Could not load media');renderGallery((data.items||[]).map(m=>({publicId:m.publicId,thumb:`https://res.cloudinary.com/demo/image/upload/w_400,h_300,c_fill,g_auto,f_auto,q_auto/${m.publicId}`,tags:m.tags,status:m.moderationStatus})))}catch(error){renderGallery([]);count.textContent=`Could not load media: ${error.message}`}}
    function renderGallery(items){gallery.innerHTML='';count.textContent=`${items.length} asset${items.length===1?'':'s'} in library`;if(!items.length){gallery.innerHTML='<div class="empty">No media here yet. Upload an asset to start building your library.</div>';return}items.forEach((item,index)=>{const card=document.createElement('article');card.className='card';card.style.animationDelay=`${Math.min(index*55,440)}ms`;const status=['approved','pending','rejected'].includes(item.status)?item.status:'pending';card.innerHTML=`<img src="${escapeHtml(item.thumb||'')}" alt="${escapeHtml(item.publicId)}" onerror="this.style.opacity='.25'" /><div class="meta"><div class="media-name">${escapeHtml(item.publicId)}</div><div class="tags">${escapeHtml((item.tags||[]).join(', ')||'No tags yet')}</div><span class="badge ${status}">${escapeHtml(status)}</span></div>`;gallery.appendChild(card)})}loadAll();
  </script></body></html>
